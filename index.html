<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubik's Cube Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- Timer -->
    <div class="timer-box" id="timerBox">
      <div id="timer" class="timer">00:00.000</div>
      <div id="status" class="status">Hold SPACE or tap &amp; hold</div>
    </div>

    <!-- Scramble Display -->
    <div class="scramble-box">
      <div class="label">SCRAMBLE</div>
      <div id="scramble" class="scramble">R U' F2 L D' B R2 U F' L2 D B' R U2 F D' L B2 R' U F2 D</div>
      <button id="newScrambleBtn" class="btn-small">New Scramble</button>
    </div>

    <!-- Cube Preview -->
    <div class="cube-box">
      <div id="cube" class="cube"></div>
    </div>

    <!-- Stats -->
    <div class="stats-box">
      <div class="stat">
        <div class="stat-label">BEST</div>
        <div id="best" class="stat-value">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">AO5</div>
        <div id="ao5" class="stat-value">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">AO12</div>
        <div id="ao12" class="stat-value">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">LAST</div>
        <div id="last" class="stat-value">--</div>
      </div>
      <div class="stat">
        <div class="stat-label">SOLVES</div>
        <div id="count" class="stat-value">0</div>
      </div>
    </div>

       <!-- History -->
    <div class="history-box">
      <div class="history-header">
        <div class="label">HISTORY (click to load scramble)</div>
        <button id="resetBtn" class="btn-small btn-danger">Reset Session</button>
      </div>
      <div id="history" class="history"></div>
    </div>

  </div>
    <!-- Modal -->
  <div id="modal" class="modal-overlay hidden">
    <div class="modal-card">
      <button id="modalClose" class="modal-close">×</button>

      <div class="modal-solve-number" id="modalSolveNumber">SOLVE #0</div>
      <div class="modal-time" id="modalTime">00:00.000</div>
      <div class="modal-date" id="modalDate">—</div>

      <div class="modal-section-label">SCRAMBLE</div>
      <div class="modal-scramble" id="modalScramble">—</div>

      <div class="modal-section-label">CUBE PREVIEW</div>
      <div id="modalCube" class="modal-cube"></div>

      <div class="modal-actions">
        <button id="modalLoad" class="btn-small">Load This Scramble</button>
        <button id="modalCloseBtn" class="btn-small">Close</button>
      </div>
    </div>
  </div>

   <script src="cube.js"></script>
  <script src="script.js"></script>
</body>
</html>
